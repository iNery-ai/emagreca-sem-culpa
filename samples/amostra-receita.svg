<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&amp;family=DM+Sans:wght@400;500;700&amp;display=swap');
      .serif-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #3D1A1E; }
      .sans-kicker { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #C93A54; text-transform: uppercase; }
      .card-title { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; fill: #3D1A1E; }
      .card-body { font-family: 'DM Sans', sans-serif; font-size: 13px; fill: #5A353A; line-height: 1.5; }
      .footer-txt { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 1px; fill: #A08085; text-transform: uppercase; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="600" height="850" fill="#FFF8F5" rx="16"/>
  
  <!-- Header Card Block -->
  <g transform="translate(30, 30)">
    <rect width="540" height="135" fill="#FCECEF" rx="18"/>
    <!-- Top-Left Accent Bar -->
    <rect x="24" y="22" width="38" height="5" fill="#E8526A" rx="2.5"/>
    <!-- Top-Right Geometric Line -->
    <path d="M 495 18 L 515 18 L 515 38" fill="none" stroke="#E8526A" stroke-width="1.5" opacity="0.4"/>
    
    <text x="24" y="52" class="sans-kicker">RECEITA 01 · 2 PORÇÕES · CERCA DE 30 MINUTOS</text>
    <text x="24" y="98" class="serif-title" font-size="34">Frango com legumes na panela</text>
  </g>
  
  <!-- Content Cards (White on Cream) -->
  <!-- Card 1: Ingredientes -->
  <g transform="translate(30, 185)">
    <rect width="540" height="110" fill="#FFFFFF" rx="14" stroke="#FDE8EC" stroke-width="1"/>
    <text x="24" y="32" class="card-title">Ingredientes</text>
    <text x="24" y="58" class="card-body">250 g de peito de frango em cubos; 1 cenoura pequena; 1 abobrinha pequena;</text>
    <text x="24" y="78" class="card-body">1/2 cebola; 1 dente de alho; 1 colher de sopa de óleo ou azeite; água e sal em</text>
    <text x="24" y="98" class="card-body">pequena quantidade.</text>
  </g>
  
  <!-- Card 2: Modo de preparo -->
  <g transform="translate(30, 310)">
    <rect width="540" height="190" fill="#FFFFFF" rx="14" stroke="#FDE8EC" stroke-width="1"/>
    <text x="24" y="32" class="card-title">Modo de preparo</text>
    <text x="24" y="58" class="card-body">1. Lave e corte os legumes. Mantenha o frango cru separado.</text>
    <text x="24" y="82" class="card-body">2. Aqueça o óleo e refogue cebola e alho. Acrescente o frango e cozinhe.</text>
    <text x="24" y="106" class="card-body">3. Adicione cenoura e um pouco de água. Tampe e mexa de vez em quando.</text>
    <text x="24" y="130" class="card-body">4. Junte a abobrinha e termine o cozimento. Confirme que o frango está</text>
    <text x="24" y="152" class="card-body">completamente cozido; o centro deve atingir pelo menos 70 °C.</text>
  </g>
  
  <!-- Card 3: Como usar na rotina -->
  <g transform="translate(30, 515)">
    <rect width="540" height="95" fill="#FFFFFF" rx="14" stroke="#FDE8EC" stroke-width="1"/>
    <text x="24" y="32" class="card-title">Como usar na rotina</text>
    <text x="24" y="58" class="card-body">Sirva com arroz e feijão, se desejar. Legumes da estação podem substituir os</text>
    <text x="24" y="78" class="card-body">sugeridos.</text>
  </g>
  
  <!-- Card 4: Atenção -->
  <g transform="translate(30, 625)">
    <rect width="540" height="85" fill="#FFFFFF" rx="14" stroke="#FDE8EC" stroke-width="1"/>
    <text x="24" y="32" class="card-title" fill="#C93A54">Atenção</text>
    <text x="24" y="58" class="card-body">Sem leite e sem ovos na formulação; confira contaminação cruzada e rótulos.</text>
  </g>
  
  <!-- Footer -->
  <g transform="translate(30, 805)">
    <text x="0" y="0" class="footer-txt">EMAGRECIMENTO SEM CULPA · COMECE PELA ROTINA</text>
    <rect x="420" y="-14" width="54" height="20" fill="#FCECEF" rx="10"/>
    <text x="447" y="0" class="footer-txt" fill="#C93A54" font-weight="700" text-anchor="middle">Índice</text>
    <text x="540" y="0" class="footer-txt" fill="#C93A54" font-weight="700" text-anchor="end">11</text>
  </g>
</svg>