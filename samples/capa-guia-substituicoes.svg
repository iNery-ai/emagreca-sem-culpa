<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #FFFFFF; }
      .tag { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; fill: #D4A054; }
      .body { font-family: 'DM Sans', sans-serif; fill: #FFFFFF; font-size: 15px; opacity: 0.9; }
    </style>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1A1E"/>
      <stop offset="60%" stop-color="#6B3A40"/>
      <stop offset="100%" stop-color="#C93A54"/>
    </linearGradient>
  </defs>
  <rect width="600" height="850" fill="url(#coverBg)" rx="16"/>
  <!-- Decorative border -->
  <rect x="25" y="25" width="550" height="800" fill="none" stroke="#D4A054" stroke-width="2" rx="12" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="780" fill="none" stroke="#FFFFFF" stroke-width="1" rx="8" opacity="0.2"/>
  
  <text x="300" y="100" class="tag" text-anchor="middle">BÔNUS INCLUÍDO NO KIT</text>
  <circle cx="300" cy="180" r="50" fill="#E8526A" opacity="0.3"/>
  <text x="300" y="195" font-size="44" text-anchor="middle">🔄</text>
  
  <text x="300" y="290" class="title" font-size="40" text-anchor="middle">Guia de</text>
  <text x="300" y="340" class="title" font-size="44" text-anchor="middle" fill="#D4A054">Substituições</text>
  <text x="300" y="390" class="title" font-size="36" text-anchor="middle">Inteligentes</text>
  
  <line x1="200" y1="430" x2="400" y2="430" stroke="#D4A054" stroke-width="2"/>
  
  <text x="300" y="480" class="body" text-anchor="middle">Alternativas culinárias práticas por</text>
  <text x="300" y="505" class="body" text-anchor="middle">ingrediente e situação para você não</text>
  <text x="300" y="530" class="body" text-anchor="middle">travar na hora de cozinhar.</text>
  
  <g transform="translate(150, 580)">
    <rect width="300" height="70" fill="#FFFFFF" fill-opacity="0.1" rx="8" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="150" y="30" class="tag" fill="#FFFFFF" text-anchor="middle" font-size="12">12 PÁGINAS DE CONSULTA</text>
    <text x="150" y="52" class="body" text-anchor="middle" font-size="12">Trocas culinárias sem complicações</text>
  </g>
  
  <text x="300" y="730" class="tag" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.7">EMAGREÇA SEM CULPA • EDIÇÃO DIGITAL</text>
  <text x="300" y="760" class="meta" text-anchor="middle" font-size="10" fill="#FFFFFF" opacity="0.5">CAPA ILUSTRATIVA DO MATERIAL DIDÁTICO</text>
</svg>